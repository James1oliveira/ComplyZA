services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: complyza
      POSTGRES_USER: complyza
      POSTGRES_PASSWORD: complyza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyza"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
