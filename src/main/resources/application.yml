server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful

spring:
  application:
    name: comply-za
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:complyza}${DB_PARAMS:}
    username: ${DB_USER:complyza}
    password: ${DB_PASSWORD:complyza}
    hikari:
      maximum-pool-size: 5      # small managed DBs allow few connections
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    # Which provider runs chat and embeddings. Local default: Ollama.
    # The "gemini" profile (below) switches both to Google Gemini.
    model:
      chat: ollama
      embedding: ollama
      embedding.text: none
    google:
      genai:
        # The Gemini embedding connection needs a key at startup even when Gemini is not used,
        # so a placeholder is set locally. The real key is only needed with the "gemini" profile.
        api-key: ${GEMINI_API_KEY:not-set}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
            temperature: 0.0
        embedding:
          api-key: ${GEMINI_API_KEY:not-set}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768       # must match vector(768) in V1__init.sql
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2}
          temperature: 0.0
          num-ctx: 8192             # default context is too small for 6 sources
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: false  # Flyway owns the schema (see db/migration)
        dimensions: 768           # must match the embedding model and V1__init.sql
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        name: comply-za
        version: 0.1.0
        type: SYNC
        instructions: "Search South African regulations (POPIA, FIC Act) and get verbatim sections with section numbers."

app:
  chat-model-label: ollama/${CHAT_MODEL:llama3.2}   # recorded in the audit log
  security:
    admin-password: ${ADMIN_PASSWORD:admin-local}
    analyst-password: ${ANALYST_PASSWORD:analyst-local}
  retrieval:
    vector-top-k: 8
    similarity-threshold: 0.25
    keyword-top-k: 8
    final-top-k: 6
  disclaimer: >-
    Comply ZA explains what the source text says. It is not legal advice.
    Confirm against the official text and consult a qualified professional before acting.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    za.co.complyza: INFO

---
# Production: no default passwords. Startup fails if they are not set.
spring:
  config:
    activate:
      on-profile: prod
app:
  security:
    admin-password: ${ADMIN_PASSWORD}
    analyst-password: ${ANALYST_PASSWORD}

---
# Hosted AI: Google Gemini for chat and embeddings (used on Render, where Ollama is not available).
# Needs GEMINI_API_KEY (free from https://aistudio.google.com/apikey).
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    model:
      chat: google-genai
      embedding: none
      embedding.text: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        embedding:
          api-key: ${GEMINI_API_KEY}
app:
  chat-model-label: gemini/${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  ingest:
    # Gemini free tier allows 100 embedding requests per minute (each chunk counts as one).
    # 40 chunks every 35 seconds stays well under that: POPIA's 128 chunks take about 2 minutes.
    batch-size: 40
    batch-pause-seconds: 35
